[package]
name = "rd-app"
default-run = "rd-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
eframe = { version = "0.36", features = ["wgpu"] }
egui = "0.36"
egui-wgpu = "0.36.2"
rd-capture = { version = "0.1.0", path = "../rd-capture" }
rd-codec = { version = "0.1.0", path = "../rd-codec" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wgpu = "30"
ureq = { version = "2.12", features = ["json"] }
serde_json = "1"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder", "NSVisualEffectView", "NSGraphics", "NSColor"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
