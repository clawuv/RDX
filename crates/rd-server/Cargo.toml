[package]
name = "rd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hmac = "0.12"
rd-protocol = { version = "0.1.0", path = "../rd-protocol" }
sha1 = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "io-util"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.29", features = ["connect"] }
