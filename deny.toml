# cargo-deny 配置。
# 项目自有代码与发行许可为 AGPL-3.0-only（含源自 DCX/SquirrelDisk 的派生 UI），
# 见 docs/licensing-inventory.md。AGPL-3.0-only 列入白名单主要覆盖自有 workspace
# crate；第三方依赖仍以宽松许可为主，新增弱/强 copyleft 依赖前先核对许可全文。

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "AGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
