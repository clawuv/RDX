# cargo-deny 配置。
# 本项目为 MIT（见 LICENSE）。AGPL/GPL 等强 copyleft 依赖禁止进入
# （未列入 allow，出现即 fail）；MPL-2.0 等弱 copyleft 依赖可用，
# 但进入前在 PR 中说明并单独评审。

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
deny = []

[advisories]
version = 2
yanked = "deny"
