[workspace]
resolver = "2"
members = [
    "crates/rd-protocol",
    "crates/rd-transport",
    "crates/rd-codec",
    "crates/rd-capture",
    "crates/rd-input",
    "crates/rd-engine",
    "crates/rd-crypto",
    "crates/rd-broker",
    "crates/rd-audio",
    "crates/rd-app",
    "crates/rd-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
thiserror = "2"
# wasm 只支持 sync,macros,io-util,rt,time；需要多线程运行时的 bin（rd-app 等）
# 在自己的 manifest 里追加 rt-multi-thread 特性。
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"

rd-protocol = { path = "crates/rd-protocol" }
rd-transport = { path = "crates/rd-transport" }
rd-capture = { path = "crates/rd-capture" }
rd-codec = { path = "crates/rd-codec" }
rd-input = { path = "crates/rd-input" }
rd-engine = { path = "crates/rd-engine" }
rd-crypto = { path = "crates/rd-crypto" }
